name: Update paper metrics

on:
  schedule:
    - cron: "17 0 * * *"   # every day, 05:32 Nepal time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_metrics.py
      - name: Commit if changed
        run: |
          if git diff --quiet metrics.json; then echo "No change"; exit 0; fi
          git config user.name "metrics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add metrics.json
          git commit -m "Update paper metrics"
          git push
